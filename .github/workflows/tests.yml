name: Tests

on:
  pull_request:
    branches: [ dev ]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:5
        env:
          MONGO_INITDB_ROOT_USERNAME: chat
          MONGO_INITDB_ROOT_PASSWORD: chat
        options: >-
          --health-cmd mongo
          --health-interval 20s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 27017:27017
    env:
      NODE_ENV: 'test'
      DATABASE_URL: 'mongodb://chat:chat@localhost:27017/tests?authSource=admin'
    steps:
    - uses: actions/checkout@v3
    - uses: denoland/setup-deno@v2
      with:
        deno-version: '2.6.8'
    - run: deno install --allow-scripts
    - name: Install Socket Firewall
      uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
      with:
        mode: firewall-free
    - name: Install frontend dependencies
      working-directory: app
      run: |
        corepack enable
        sfw pnpm install --frozen-lockfile
    - name: Frontend lint
      working-directory: app
      run: pnpm lint
    - name: Frontend build
      working-directory: app
      run: pnpm build
      env:
        APP_NAME: quack
        APP_VERSION: ${{ github.sha }}
    - run: deno task migrate:tests
    - run: deno task check
