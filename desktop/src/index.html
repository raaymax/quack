<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Quack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: #1a1d21;
      color: #d1d2d3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 { font-size: 2rem; margin: 0 0 0.25rem; }

    #subtitle {
      color: #9ea0a3;
      margin: 0 0 2rem;
      font-size: 0.95rem;
    }

    /* ── Grid ── */
    #grid-view { display: flex; flex-direction: column; align-items: center; }

    #server-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      max-width: 640px;
      margin-bottom: 0;
    }

    /* ── Cards ── */
    .server-card {
      width: 140px;
      height: 140px;
      background: #2c2f33;
      border: 2px solid #3a3d41;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 10px 14px;
      position: relative;
      transition: border-color 0.15s;
      user-select: none;
    }
    .server-card:hover { border-color: #673ab8; }

    .card-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: #d1d2d3;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-subtitle {
      font-size: 0.7rem;
      color: #6e7175;
      text-align: center;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }

    .card-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e74c3c;
      border: none;
      color: #fff;
      font-size: 0.75rem;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.1s;
    }
    .server-card:hover .card-remove { display: flex; }
    .card-remove:hover { background: #c0392b; }

    /* ── Add card ── */
    .add-card {
      width: 140px;
      height: 140px;
      background: transparent;
      border: 2px dashed #3a3d41;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #6e7175;
      font-size: 0.82rem;
      transition: border-color 0.15s, color 0.15s;
      user-select: none;
    }
    .add-card:hover { border-color: #673ab8; color: #673ab8; }

    .add-icon {
      font-size: 2rem;
      line-height: 1;
      font-weight: 300;
    }

    /* ── Add form ── */
    #add-form-view { display: none; flex-direction: column; align-items: center; }

    input {
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #3a3d41;
      border-radius: 6px;
      background: #2c2f33;
      color: #d1d2d3;
      width: 350px;
      margin-top: 0;
      outline: none;
    }
    input:focus { border-color: #673ab8; }

    .form-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button.btn-primary {
      padding: 11px 28px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #673ab8;
      color: white;
      cursor: pointer;
    }
    button.btn-primary:hover { background: #7c4dcc; }

    button.btn-secondary {
      padding: 11px 20px;
      font-size: 15px;
      border: 1px solid #3a3d41;
      border-radius: 6px;
      background: transparent;
      color: #9ea0a3;
      cursor: pointer;
    }
    button.btn-secondary:hover { border-color: #673ab8; color: #d1d2d3; }

    .error { color: #e74c3c; margin-top: 8px; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <h1>Quack</h1>
  <p id="subtitle">Choose a server</p>

  <!-- Grid view -->
  <div id="grid-view">
    <div id="server-grid">
      <!-- server cards injected here -->
      <div class="add-card" id="add-card" onclick="showAddForm()">
        <span class="add-icon">+</span>
        <span>Add server</span>
      </div>
    </div>
  </div>

  <!-- Add-form view -->
  <div id="add-form-view">
    <input type="url" id="server-url" placeholder="https://your-quack-server.com" autofocus />
    <div class="error" id="error"></div>
    <div class="form-buttons">
      <button class="btn-secondary" id="cancel-btn" onclick="hideAddForm()">Cancel</button>
      <button class="btn-primary" id="connect-btn" onclick="connect()">Connect</button>
    </div>
  </div>

  <script>
    const AVATAR_COLORS = ['#673ab8', '#2196f3', '#009688', '#e91e63', '#ff5722', '#8bc34a'];

    let store = null;
    let servers = [];

    function colorForUrl(url) {
      let hash = 0;
      for (let i = 0; i < url.length; i++) hash = (hash * 31 + url.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[hash % AVATAR_COLORS.length];
    }

    function hostnameFor(url) {
      try { return new URL(url).hostname; } catch { return url; }
    }

    function renderServers() {
      const grid = document.getElementById('server-grid');
      const addCard = document.getElementById('add-card');
      const subtitle = document.getElementById('subtitle');

      // Remove old server cards (keep the add-card)
      grid.querySelectorAll('.server-card').forEach(el => el.remove());

      if (servers.length === 0) {
        subtitle.textContent = 'Add your first server';
        showAddForm();
        return;
      }

      subtitle.textContent = 'Choose a server';

      const sorted = [...servers].sort((a, b) => (b.lastUsed || 0) - (a.lastUsed || 0));

      sorted.forEach(server => {
        const host = hostnameFor(server.url);
        const letter = host.charAt(0).toUpperCase();
        const color = colorForUrl(server.url);

        const card = document.createElement('div');
        card.className = 'server-card';
        card.innerHTML = `
          <div class="card-avatar" style="background:${color}">${letter}</div>
          <div class="card-title">${host}</div>
          <div class="card-subtitle">${server.url}</div>
          <button class="card-remove" title="Remove server">×</button>
        `;

        card.addEventListener('click', () => connectTo(server.url));
        card.querySelector('.card-remove').addEventListener('click', (e) => {
          e.stopPropagation();
          removeServer(server.url);
        });

        grid.insertBefore(card, addCard);
      });
    }

    async function loadServers() {
      try {
        if (window.__TAURI__) {
          const { load } = await import('https://unpkg.com/@tauri-apps/plugin-store/dist/index.min.mjs');
          store = await load('config.json');

          // Migrate legacy single-URL key
          const legacyUrl = await store.get('server_url');
          if (legacyUrl) {
            servers = [{ url: legacyUrl, addedAt: Date.now(), lastUsed: Date.now() }];
            await store.delete('server_url');
            await saveServers();
          } else {
            servers = (await store.get('servers')) || [];
          }
        }
      } catch (e) {
        console.log('Store unavailable:', e);
        servers = [];
      }

      renderServers();
    }

    async function saveServers() {
      if (store) {
        await store.set('servers', servers);
        await store.save();
      }
    }

    async function connectTo(url) {
      const entry = servers.find(s => s.url === url);
      if (entry) {
        entry.lastUsed = Date.now();
      } else {
        servers.push({ url, addedAt: Date.now(), lastUsed: Date.now() });
      }
      await saveServers();
      window.location.href = url;
    }

    async function removeServer(url) {
      servers = servers.filter(s => s.url !== url);
      await saveServers();
      renderServers();
    }

    function showAddForm() {
      document.getElementById('grid-view').style.display = 'none';
      const form = document.getElementById('add-form-view');
      form.style.display = 'flex';
      document.getElementById('server-url').value = '';
      document.getElementById('error').style.display = 'none';
      document.getElementById('server-url').focus();
    }

    function hideAddForm() {
      document.getElementById('add-form-view').style.display = 'none';
      document.getElementById('grid-view').style.display = 'flex';
    }

    async function connect() {
      const input = document.getElementById('server-url');
      const error = document.getElementById('error');
      const url = input.value.trim().replace(/\/+$/, '');

      if (!url) {
        error.textContent = 'Please enter a server URL';
        error.style.display = 'block';
        return;
      }

      try {
        new URL(url);
      } catch {
        error.textContent = 'Invalid URL format';
        error.style.display = 'block';
        return;
      }

      error.style.display = 'none';
      await connectTo(url);
    }

    document.getElementById('server-url').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
      if (e.key === 'Escape') { if (servers.length > 0) hideAddForm(); }
    });

    loadServers();
  </script>
</body>
</html>
